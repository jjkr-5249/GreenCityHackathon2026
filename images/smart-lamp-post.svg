<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb74d"/>
      <stop offset="1" stop-color="#fff3e0"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#455a64"/>
      <stop offset="0.5" stop-color="#78909c"/>
      <stop offset="1" stop-color="#37474f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff59d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff59d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="420" rx="12" fill="url(#sky)"/>
  <circle cx="265" cy="55" r="26" fill="#fff176" opacity="0.85"/>

  <!-- Ground & pavement -->
  <rect x="0" y="372" width="320" height="48" fill="#9e9e9e"/>
  <rect x="0" y="372" width="320" height="6" fill="#bdbdbd"/>

  <!-- Tree in background -->
  <rect x="262" y="300" width="8" height="74" fill="#6d4c41"/>
  <circle cx="266" cy="290" r="30" fill="#66bb6a"/>
  <circle cx="248" cy="305" r="18" fill="#4caf50"/>
  <circle cx="284" cy="305" r="18" fill="#43a047"/>

  <!-- Light cone -->
  <polygon points="168,92 216,92 270,372 114,372" fill="url(#glow)"/>

  <!-- Pole -->
  <rect x="84" y="70" width="14" height="302" fill="url(#pole)"/>
  <rect x="76" y="352" width="30" height="22" rx="3" fill="#37474f"/>

  <!-- Arm -->
  <path d="M91 74 Q91 58 110 58 L192 58" stroke="#455a64" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- LED lamp head -->
  <rect x="160" y="62" width="64" height="20" rx="8" fill="#37474f"/>
  <rect x="166" y="80" width="52" height="8" rx="3" fill="#fffde7"/>

  <!-- Solar / power note at top -->
  <circle cx="91" cy="66" r="7" fill="#263238"/>

  <!-- senseBox in bird-box housing -->
  <polygon points="40,150 70,128 100,150" fill="#8d6e63"/>
  <rect x="44" y="150" width="52" height="58" rx="3" fill="#a1887f"/>
  <rect x="50" y="158" width="40" height="22" rx="3" fill="#263238"/>
  <text x="70" y="173" font-size="9" fill="#4caf50" text-anchor="middle" font-weight="bold">senseBox</text>
  <circle cx="58" cy="194" r="4" fill="#5d4037"/>
  <circle cx="70" cy="194" r="4" fill="#5d4037"/>
  <circle cx="82" cy="194" r="4" fill="#5d4037"/>
  <rect x="96" y="172" width="10" height="6" fill="#455a64"/>

  <!-- Wireless signal -->
  <path d="M30 140 Q22 130 30 120" stroke="#e65100" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M22 146 Q8 130 22 114" stroke="#e65100" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Gas sensor module lower on pole -->
  <rect x="98" y="236" width="30" height="22" rx="4" fill="#ef6c00"/>
  <text x="113" y="251" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">NO₂/O₃</text>

  <!-- Labels -->
  <g font-size="10" fill="#3e2723">
    <line x1="224" y1="72" x2="240" y2="110" stroke="#5d4037" stroke-width="1"/>
    <text x="196" y="122">LED street light</text>

    <line x1="44" y1="208" x2="30" y2="226" stroke="#5d4037" stroke-width="1"/>
    <text x="8" y="238">🌡️ Temp · 💧 Humidity</text>
    <text x="8" y="251">🌬️ PM1 · PM2.5 · PM4 · PM10</text>

    <line x1="128" y1="247" x2="146" y2="247" stroke="#5d4037" stroke-width="1"/>
    <text x="148" y="244">⚗️ Gas sensors</text>
    <text x="148" y="257">traffic &amp; ozone</text>

    <text x="112" y="300">⚡ Powered by the</text>
    <text x="112" y="313">lamp post's electricity</text>
  </g>

  <!-- Title -->
  <text x="160" y="404" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">Smart Lamp Post · every 200 m</text>
</svg>
